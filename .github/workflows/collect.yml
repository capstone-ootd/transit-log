name: collect

# 평일 출퇴근 시간대에 9404 차량 위치를 받아 data/에 올린다.
# GitHub 예약 실행(schedule)은 2.5~9시간 늦게 시작해 09.30~10.06 수집을 모두 놓쳤다. 그래서 예약 실행을 쓰지 않고,
# 외부 cron(cron-job.org)이 06:50·18:20 KST(월~금)에 workflow_dispatch API를 부른다. 수동 실행은 바로 시작한다.
# collect.ts가 구간 시작까지 기다리고, 구간이 이미 끝났으면 받지 않고 끝난다. 설정은 README의 "돌리는 법".
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'am 07:00~09:00, pm 18:30~21:00'
        type: choice
        options: [am, pm]
        required: true
        default: am
      minutes:
        description: '구간 대신 지금부터 N분 (비우면 구간대로)'
        required: false
        default: ''

# 외부 cron이 재시도로 두 번 부르더라도 같은 구간은 하나만 돈다
concurrency:
  group: collect-${{ inputs.slot }}-${{ inputs.minutes }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SEOUL_SUBWAY_KEY: ${{ secrets.SEOUL_SUBWAY_KEY }}
          SLOT: ${{ inputs.slot }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          if [ -n "$MINUTES" ]; then
            node collect.ts "$SLOT" --minutes "$MINUTES"
          else
            node collect.ts "$SLOT"
          fi

      - name: 올리기
        if: always()
        run: |
          shopt -s nullglob
          files=(data/*/*.jsonl)
          [ ${#files[@]} -eq 0 ] && { echo '올릴 파일 없음'; exit 0; }
          gzip -f "${files[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "수집 $(date +%F) $(basename "${files[0]}" .jsonl)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
